name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Audit des dépendances (échoue sur vulnérabilité élevée ou critique)
        run: npm audit --audit-level=high
      - name: Build (variables factices : aucun secret nécessaire)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: https://example.vercel.app
          NEXT_PUBLIC_CAPTCHA_ENABLED: 'false'
